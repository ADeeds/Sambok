<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1216" />
      <stop offset="100%" stop-color="#141920" />
    </linearGradient>

    <linearGradient id="seat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2732" />
      <stop offset="100%" stop-color="#121820" />
    </linearGradient>

    <radialGradient id="vent-glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="breeze-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#BAE6FD" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="breeze-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0" />
      <stop offset="30%" stop-color="#7DD3FC" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#E0F2FE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg-grad)" />

  <g id="car-ac-vent" transform="translate(40, 180)">
    <ellipse cx="60" cy="130" rx="140" ry="170" fill="url(#vent-glow)" class="vent-halo">
      <animate attributeName="opacity" values="0.45;0.85;0.45" keyTimes="0;0.5;1" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="rx" values="140;152;140" keyTimes="0;0.5;1" dur="2.8s" repeatCount="indefinite" />
    </ellipse>

    <rect x="0" y="20" width="85" height="220" rx="16" fill="#1B232C" stroke="#2D3A49" stroke-width="4" />
    <rect x="8" y="28" width="69" height="204" rx="10" fill="#0E1318" />

    <line x1="16" y1="52" x2="70" y2="44" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="16" y1="78" x2="70" y2="70" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
    <line x1="16" y1="104" x2="70" y2="96" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" />
    <line x1="16" y1="130" x2="70" y2="122" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
    <line x1="16" y1="156" x2="70" y2="148" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="16" y1="182" x2="70" y2="174" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <line x1="16" y1="208" x2="70" y2="200" stroke="#334155" stroke-width="6" stroke-linecap="round" />

    <rect x="18" y="112" width="5" height="36" rx="2.5" fill="#38BDF8" filter="url(#soft-glow)" opacity="0.8" />
  </g>

  <path d="M 0 540 Q 400 525, 800 530 T 1200 540 L 1200 720 L 0 720 Z" fill="url(#seat-grad)" />
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#2D3846" stroke-width="3" opacity="0.6" />

  <ellipse cx="730" cy="565" rx="280" ry="28" fill="#0A0E13" opacity="0.75" />

  <g id="dog-character">
    <g class="dog-tail">
      <animateTransform attributeName="transform" type="rotate"
        values="0 940 480; -9 940 480; 7 940 480; 0 940 480"
        keyTimes="0; 0.3; 0.6; 1" dur="2.0s" repeatCount="indefinite" />
      <path d="M 920 480 Q 980 470 1020 420 Q 1040 390 1055 350 Q 1045 365 1020 410 Q 980 455 910 495 Z" fill="#9E6C3F" />
      <path d="M 1030 400 Q 1055 350 1060 340 Q 1045 365 1020 410 Z" fill="#CE9860" />
    </g>

    <path d="M 830 440 C 900 440, 940 480, 930 540 C 925 560, 890 570, 840 565 C 790 560, 780 500, 800 460 Z" fill="#A87545" />

    <g class="dog-torso">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -6 -13; 0 0" keyTimes="0; 0.5; 1" dur="3.6s" repeatCount="indefinite" />
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="1 1; 1.008 1.015; 1 1" keyTimes="0; 0.5; 1" dur="3.6s" repeatCount="indefinite" />
        <path d="M 580 470 C 580 410, 640 370, 740 380 C 850 390, 910 430, 910 520 C 910 560, 840 565, 740 565 C 640 565, 580 540, 580 470 Z" fill="#C08A55" />
        <path d="M 640 510 C 690 490, 780 495, 840 525 C 820 550, 750 560, 680 555 C 650 545, 640 525, 640 510 Z" fill="#E6D2B4" opacity="0.6" />
        <path d="M 580 440 C 560 470, 565 520, 610 550 C 590 520, 590 470, 610 430 Z" fill="#CE9860" />
        <path d="M 660 480 L 685 560 L 635 560 L 630 490 Z" fill="#9E6C3F" rx="15" />
        <rect x="585" y="475" width="55" height="90" rx="24" fill="#C08A55" />
        <ellipse cx="612" cy="560" rx="30" ry="14" fill="#C08A55" />
        <line x1="604" y1="556" x2="604" y2="568" stroke="#24170E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
        <line x1="620" y1="556" x2="620" y2="568" stroke="#24170E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      </g>
    </g>

    <g class="ear-back">
      <animateTransform attributeName="transform" type="rotate"
        values="0 670 270; -6 670 270; 4 670 270; -7 670 270; 0 670 270"
        keyTimes="0; 0.3; 0.65; 0.85; 1" dur="0.8s" repeatCount="indefinite" />
      <path d="M 650 290 Q 690 270 720 310 Q 735 360 705 400 Q 675 410 650 370 Z" fill="#7E5530" />
    </g>

    <g class="dog-head-group">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -4; 0 0" keyTimes="0; 0.5; 1" dur="3.6s" repeatCount="indefinite" />
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 640 380; 2 640 380; 0 640 380"
          keyTimes="0; 0.5; 1" dur="3.6s" repeatCount="indefinite" />

        <path d="M 630 350 L 670 440 L 590 440 Z" fill="#CE9860" />
        <ellipse cx="615" cy="335" rx="80" ry="75" fill="#CE9860" />
        <path d="M 590 320 Q 510 325 480 365 Q 480 395 530 410 Q 580 415 620 380 Z" fill="#E6D2B4" />
        <path d="M 478 358 Q 470 365 476 374 Q 485 382 494 374 Q 498 365 490 358 Z" fill="#24170E" />
        <ellipse cx="482" cy="364" rx="3" ry="2" fill="#FFFFFF" opacity="0.4" />
        <path d="M 490 378 Q 515 395 540 388 Q 560 380 575 386" fill="none" stroke="#24170E" stroke-width="3.5" stroke-linecap="round" />

        <g class="dog-tongue">
          <animateTransform attributeName="transform" type="translate"
            values="0 0; 0 -30; 0 0" keyTimes="0; 0.5; 1" dur="1.4s" repeatCount="indefinite" />
          <g>
            <animateTransform attributeName="transform" type="scale"
              values="1 1; 1 1.08; 1 1" keyTimes="0; 0.5; 1" dur="1.4s" repeatCount="indefinite" />
            <path d="M 518 390 C 518 412, 542 412, 542 390 Z" fill="#F472B6" stroke="#24170E" stroke-width="2" />
            <line x1="530" y1="390" x2="530" y2="404" stroke="#DB2777" stroke-width="1.8" />
          </g>
        </g>

        <path d="M 540 332 Q 556 318 572 332" fill="none" stroke="#24170E" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 574 330 L 582 327" stroke="#24170E" stroke-width="3" stroke-linecap="round" />
        <path d="M 622 322 Q 634 312 646 322" fill="none" stroke="#24170E" stroke-width="4" stroke-linecap="round" opacity="0.8" />
        <ellipse cx="565" cy="355" rx="16" ry="10" fill="#D98C7A" opacity="0.32" />

        <g class="ear-front">
          <animateTransform attributeName="transform" type="rotate"
            values="0 590 290; -8 590 290; 3 590 290; -10 590 290; 0 590 290"
            keyTimes="0; 0.25; 0.5; 0.75; 1" dur="0.65s" repeatCount="indefinite" />
          <path d="M 590 280 Q 640 260 655 310 Q 670 380 630 430 Q 595 440 585 390 Q 575 330 590 280 Z" fill="#9E6C3F" />
          <path d="M 605 310 Q 635 295 645 330 Q 652 380 625 410 Q 602 415 600 375 Z" fill="#7E5530" />
        </g>
      </g>
    </g>
  </g>

  <path d="M 125 240 C 260 210, 400 240, 530 280 C 620 305, 730 290, 880 340" fill="none" stroke="url(#breeze-grad-1)" stroke-width="8" stroke-linecap="round" stroke-dasharray="400 300" class="breeze-line-1">
    <animate attributeName="stroke-dashoffset" values="800;-800" dur="3.0s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.85;0.65;0.1" keyTimes="0;0.3;0.8;1" dur="3.0s" repeatCount="indefinite" />
  </path>

  <path d="M 125 290 C 240 285, 360 320, 480 350 C 560 370, 680 365, 820 410" fill="none" stroke="url(#breeze-grad-2)" stroke-width="12" stroke-linecap="round" stroke-dasharray="350 250" class="breeze-line-2">
    <animate attributeName="stroke-dashoffset" values="800;-800" dur="2.6s" begin="-0.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.85;0.65;0.1" keyTimes="0;0.3;0.8;1" dur="2.6s" begin="-0.8s" repeatCount="indefinite" />
  </path>

  <path d="M 125 340 C 280 350, 410 400, 550 435 C 690 470, 830 460, 960 480" fill="none" stroke="url(#breeze-grad-1)" stroke-width="9" stroke-linecap="round" stroke-dasharray="450 350" class="breeze-line-3">
    <animate attributeName="stroke-dashoffset" values="800;-800" dur="3.4s" begin="-1.7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.85;0.65;0.1" keyTimes="0;0.3;0.8;1" dur="3.4s" begin="-1.7s" repeatCount="indefinite" />
  </path>

  <path d="M 125 390 C 290 420, 420 480, 560 515 C 670 540, 780 540, 910 535" fill="none" stroke="url(#breeze-grad-2)" stroke-width="7" stroke-linecap="round" stroke-dasharray="300 280" class="breeze-line-4">
    <animate attributeName="stroke-dashoffset" values="800;-800" dur="2.8s" begin="-0.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.85;0.65;0.1" keyTimes="0;0.3;0.8;1" dur="2.8s" begin="-0.4s" repeatCount="indefinite" />
  </path>

  <g transform="translate(180, 270)">
    <g class="flake-1" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0; 650 40" dur="3.2s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0.8;0" keyTimes="0;0.2;0.8;1" dur="3.2s" begin="0s" repeatCount="indefinite" />
      <circle cx="0" cy="0" r="4" fill="#E0F2FE" filter="url(#soft-glow)" />
      <path d="M -7 0 L 7 0 M 0 -7 L 0 7" stroke="#BAE6FD" stroke-width="2" />
    </g>
  </g>

  <g transform="translate(220, 330)">
    <g class="flake-2" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0; 650 40" dur="2.9s" begin="1.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0.8;0" keyTimes="0;0.2;0.8;1" dur="2.9s" begin="1.1s" repeatCount="indefinite" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" filter="url(#soft-glow)" />
      <path d="M -5 0 L 5 0 M 0 -5 L 0 5" stroke="#7DD3FC" stroke-width="1.8" />
    </g>
  </g>

  <g transform="translate(150, 370)">
    <g class="flake-3" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0; 650 40" dur="3.5s" begin="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0.8;0" keyTimes="0;0.2;0.8;1" dur="3.5s" begin="1.8s" repeatCount="indefinite" />
      <circle cx="0" cy="0" r="4.5" fill="#BAE6FD" filter="url(#soft-glow)" />
      <path d="M -6 -6 L 6 6 M -6 6 L 6 -6" stroke="#E0F2FE" stroke-width="2" />
    </g>
  </g>

  <g transform="translate(260, 290)">
    <g class="flake-4" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0; 650 40" dur="2.7s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0.8;0" keyTimes="0;0.2;0.8;1" dur="2.7s" begin="0.5s" repeatCount="indefinite" />
      <circle cx="0" cy="0" r="3.5" fill="#38BDF8" filter="url(#soft-glow)" />
    </g>
  </g>
</svg>
