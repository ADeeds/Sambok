<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1216" />
      <stop offset="100%" stop-color="#141920" />
    </linearGradient>

    <!-- Ground / Seat Gradient -->
    <linearGradient id="seat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2732" />
      <stop offset="100%" stop-color="#121820" />
    </linearGradient>

    <!-- Vent Glow -->
    <radialGradient id="vent-glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Cool Air Stream Gradients -->
    <linearGradient id="breeze-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#BAE6FD" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="breeze-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0" />
      <stop offset="30%" stop-color="#7DD3FC" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#E0F2FE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Frost Particle Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes earFlap {
      0%, 100% {
        transform: rotate(0deg);
      }
      25% {
        transform: rotate(-7deg) skewX(3deg);
      }
      50% {
        transform: rotate(2deg) skewX(-2deg);
      }
      75% {
        transform: rotate(-9deg) skewX(4deg);
      }
    }

    @keyframes earBackFlap {
      0%, 100% {
        transform: rotate(0deg);
      }
      30% {
        transform: rotate(-5deg);
      }
      65% {
        transform: rotate(3deg);
      }
      85% {
        transform: rotate(-6deg);
      }
    }

    @keyframes dogBreathe {
      0%, 100% {
        transform: translateY(0px) scale(1, 1);
      }
      50% {
        transform: translateY(-5px) scale(1.008, 1.015);
      }
    }

    @keyframes headBask {
      0%, 100% {
        transform: rotate(0deg) translateY(0);
      }
      50% {
        transform: rotate(1.5deg) translateY(-3px);
      }
    }

    @keyframes tongueHappy {
      0%, 100% {
        transform: scaleY(1);
      }
      50% {
        transform: scaleY(1.08) translateY(1px);
      }
    }

    @keyframes tailWag {
      0%, 100% {
        transform: rotate(0deg);
      }
      30% {
        transform: rotate(-8deg);
      }
      60% {
        transform: rotate(6deg);
      }
    }

    @keyframes airFlow {
      0% {
        stroke-dashoffset: 800;
        opacity: 0.2;
      }
      30% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.65;
      }
      100% {
        stroke-dashoffset: -800;
        opacity: 0.1;
      }
    }

    @keyframes ventPulse {
      0%, 100% {
        opacity: 0.45;
        transform: scaleX(1);
      }
      50% {
        opacity: 0.85;
        transform: scaleX(1.08);
      }
    }

    @keyframes snowflakeDrift {
      0% {
        transform: translate(0, 0) scale(0.6);
        opacity: 0;
      }
      20% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translate(650px, 40px) scale(1);
        opacity: 0;
      }
    }

    /* Assign Animations */
    .dog-torso {
      animation: dogBreathe 3.6s ease-in-out infinite;
      transform-origin: 750px 520px;
    }

    .dog-head-group {
      animation: headBask 3.6s ease-in-out infinite;
      transform-origin: 640px 380px;
    }

    .ear-front {
      animation: earFlap 0.65s ease-in-out infinite;
      transform-origin: 590px 290px;
    }

    .ear-back {
      animation: earBackFlap 0.8s ease-in-out infinite;
      transform-origin: 670px 270px;
    }

    .dog-tongue {
      animation: tongueHappy 1.8s ease-in-out infinite;
      transform-origin: 540px 395px;
    }

    .dog-tail {
      animation: tailWag 2.4s ease-in-out infinite;
      transform-origin: 940px 480px;
    }

    .vent-halo {
      animation: ventPulse 2.8s ease-in-out infinite;
      transform-origin: 100px 300px;
    }

    .breeze-line-1 {
      stroke-dasharray: 400 300;
      animation: airFlow 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .breeze-line-2 {
      stroke-dasharray: 350 250;
      animation: airFlow 2.6s cubic-bezier(0.4, 0, 0.2, 1) -0.8s infinite;
    }

    .breeze-line-3 {
      stroke-dasharray: 450 350;
      animation: airFlow 3.4s cubic-bezier(0.4, 0, 0.2, 1) -1.7s infinite;
    }

    .breeze-line-4 {
      stroke-dasharray: 300 280;
      animation: airFlow 2.8s cubic-bezier(0.4, 0, 0.2, 1) -0.4s infinite;
    }

    .flake-1 { animation: snowflakeDrift 3.2s linear 0s infinite; }
    .flake-2 { animation: snowflakeDrift 2.9s linear 1.1s infinite; }
    .flake-3 { animation: snowflakeDrift 3.5s linear 1.8s infinite; }
    .flake-4 { animation: snowflakeDrift 2.7s linear 0.5s infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#bg-grad)" />

  <!-- Car Dashboard Vent (Left Side) -->
  <g id="car-ac-vent" transform="translate(40, 180)">
    <!-- Ambient Vent Cold Glow -->
    <ellipse cx="60" cy="130" rx="140" ry="170" fill="url(#vent-glow)" class="vent-halo" />

    <!-- Vent Outer Bezel -->
    <rect x="0" y="20" width="85" height="220" rx="16" fill="#1B232C" stroke="#2D3A49" stroke-width="4" />
    <rect x="8" y="28" width="69" height="204" rx="10" fill="#0E1318" />

    <!-- AC Vent Louvers (Slats angled right toward the dog) -->
    <line x1="16" y1="52" x2="70" y2="44" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="16" y1="78" x2="70" y2="70" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
    <line x1="16" y1="104" x2="70" y2="96" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" />
    <line x1="16" y1="130" x2="70" y2="122" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
    <line x1="16" y1="156" x2="70" y2="148" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="16" y1="182" x2="70" y2="174" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <line x1="16" y1="208" x2="70" y2="200" stroke="#334155" stroke-width="6" stroke-linecap="round" />

    <!-- Subtle AC Blue Accent indicator -->
    <rect x="18" y="112" width="5" height="36" rx="2.5" fill="#38BDF8" filter="url(#soft-glow)" opacity="0.8" />
  </g>

  <!-- Car Seat / Floor Base -->
  <path d="M 0 540 Q 400 525, 800 530 T 1200 540 L 1200 720 L 0 720 Z" fill="url(#seat-grad)" />
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#2D3846" stroke-width="3" opacity="0.6" />

  <!-- Soft Shadow under dog -->
  <ellipse cx="730" cy="565" rx="280" ry="28" fill="#0A0E13" opacity="0.75" />

  <!-- ==================== THE DOG ==================== -->
  <g id="dog-character">
    <!-- Tail (Behind body) -->
    <g class="dog-tail">
      <path d="M 920 480 Q 980 470 1020 420 Q 1040 390 1055 350 Q 1045 365 1020 410 Q 980 455 910 495 Z" fill="#9E6C3F" />
      <!-- Tail Fluff Tip -->
      <path d="M 1030 400 Q 1055 350 1060 340 Q 1045 365 1020 410 Z" fill="#CE9860" />
    </g>

    <!-- Hind Leg / Thigh (resting) -->
    <path d="M 830 440 C 900 440, 940 480, 930 540 C 925 560, 890 570, 840 565 C 790 560, 780 500, 800 460 Z" fill="#A87545" />

    <!-- Main Torso / Body -->
    <g class="dog-torso">
      <!-- Body Mass -->
      <path d="M 580 470 C 580 410, 640 370, 740 380 C 850 390, 910 430, 910 520 C 910 560, 840 565, 740 565 C 640 565, 580 540, 580 470 Z" fill="#C08A55" />
      
      <!-- Lighter Underbelly Tone -->
      <path d="M 640 510 C 690 490, 780 495, 840 525 C 820 550, 750 560, 680 555 C 650 545, 640 525, 640 510 Z" fill="#E6D2B4" opacity="0.6" />

      <!-- Chest Front -->
      <path d="M 580 440 C 560 470, 565 520, 610 550 C 590 520, 590 470, 610 430 Z" fill="#CE9860" />

      <!-- Front Leg Right (Back layer) -->
      <path d="M 660 480 L 685 560 L 635 560 L 630 490 Z" fill="#9E6C3F" rx="15" />
      
      <!-- Front Leg Left (Foreground) -->
      <rect x="585" y="475" width="55" height="90" rx="24" fill="#C08A55" />
      <ellipse cx="612" cy="560" rx="30" ry="14" fill="#C08A55" />
      <!-- Paw indentations -->
      <line x1="604" y1="556" x2="604" y2="568" stroke="#24170E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <line x1="620" y1="556" x2="620" y2="568" stroke="#24170E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Ear Back (Behind Head, fluttering) -->
    <g class="ear-back">
      <path d="M 650 290 Q 690 270 720 310 Q 735 360 705 400 Q 675 410 650 370 Z" fill="#7E5530" />
    </g>

    <!-- Head & Neck Group -->
    <g class="dog-head-group">
      <!-- Neck -->
      <path d="M 630 350 L 670 440 L 590 440 Z" fill="#CE9860" />

      <!-- Head Base -->
      <ellipse cx="615" cy="335" rx="80" ry="75" fill="#CE9860" />

      <!-- Snout / Muzzle (Facing Left towards AC Vent!) -->
      <path d="M 590 320 Q 510 325 480 365 Q 480 395 530 410 Q 580 415 620 380 Z" fill="#E6D2B4" />

      <!-- Cute Black Dog Nose -->
      <path d="M 478 358 Q 470 365 476 374 Q 485 382 494 374 Q 498 365 490 358 Z" fill="#24170E" />
      <!-- Nose highlight -->
      <ellipse cx="482" cy="364" rx="3" ry="2" fill="#FFFFFF" opacity="0.4" />

      <!-- Contented Smile Mouth Line -->
      <path d="M 490 378 Q 515 395 540 388 Q 560 380 575 386" fill="none" stroke="#24170E" stroke-width="3.5" stroke-linecap="round" />

      <!-- Happy Little Tongue peeking out enjoying the cold air -->
      <g class="dog-tongue">
        <path d="M 518 390 C 518 412, 542 412, 542 390 Z" fill="#F472B6" stroke="#24170E" stroke-width="2" />
        <line x1="530" y1="390" x2="530" y2="404" stroke="#DB2777" stroke-width="1.8" />
      </g>

      <!-- Eyes (Squinted in blissful chill satisfaction: "^ ^") -->
      <!-- Left Eye (Front) -->
      <path d="M 540 332 Q 556 318 572 332" fill="none" stroke="#24170E" stroke-width="4.5" stroke-linecap="round" />
      <!-- Eyelash / Happy Crinkle -->
      <path d="M 574 330 L 582 327" stroke="#24170E" stroke-width="3" stroke-linecap="round" />
      
      <!-- Right Eye (Subtle Perspective) -->
      <path d="M 622 322 Q 634 312 646 322" fill="none" stroke="#24170E" stroke-width="4" stroke-linecap="round" opacity="0.8" />

      <!-- Rosy Cheeks (Chilled warmth) -->
      <ellipse cx="565" cy="355" rx="16" ry="10" fill="#D98C7A" opacity="0.32" />

      <!-- Foreground Floppy Ear (Flapping in breeze) -->
      <g class="ear-front">
        <!-- Ear Outer -->
        <path d="M 590 280 Q 640 260 655 310 Q 670 380 630 430 Q 595 440 585 390 Q 575 330 590 280 Z" fill="#9E6C3F" />
        <!-- Ear Inner Shadow/Depth -->
        <path d="M 605 310 Q 635 295 645 330 Q 652 380 625 410 Q 602 415 600 375 Z" fill="#7E5530" />
      </g>
    </g>
  </g>

  <!-- ==================== COOL BREEZE CURRENTS ==================== -->
  <!-- Stream 1 (High arc entering above dog's head) -->
  <path d="M 125 240 C 260 210, 400 240, 530 280 C 620 305, 730 290, 880 340" 
        fill="none" stroke="url(#breeze-grad-1)" stroke-width="8" stroke-linecap="round" class="breeze-line-1" />

  <!-- Stream 2 (Direct hit right on muzzle and flapping ear!) -->
  <path d="M 125 290 C 240 285, 360 320, 480 350 C 560 370, 680 365, 820 410" 
        fill="none" stroke="url(#breeze-grad-2)" stroke-width="12" stroke-linecap="round" class="breeze-line-2" />

  <!-- Stream 3 (Mid-chest flow) -->
  <path d="M 125 340 C 280 350, 410 400, 550 435 C 690 470, 830 460, 960 480" 
        fill="none" stroke="url(#breeze-grad-1)" stroke-width="9" stroke-linecap="round" class="breeze-line-3" />

  <!-- Stream 4 (Low air eddy across paws) -->
  <path d="M 125 390 C 290 420, 420 480, 560 515 C 670 540, 780 540, 910 535" 
        fill="none" stroke="url(#breeze-grad-2)" stroke-width="7" stroke-linecap="round" class="breeze-line-4" />

  <!-- Floating Cold Sparkles / Frost Crystals drifting across -->
  <!-- Flake 1 -->
  <g class="flake-1" transform="translate(180, 270)">
    <circle cx="0" cy="0" r="4" fill="#E0F2FE" filter="url(#soft-glow)" />
    <path d="M -7 0 L 7 0 M 0 -7 L 0 7" stroke="#BAE6FD" stroke-width="2" />
  </g>

  <!-- Flake 2 -->
  <g class="flake-2" transform="translate(220, 330)">
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" filter="url(#soft-glow)" />
    <path d="M -5 0 L 5 0 M 0 -5 L 0 5" stroke="#7DD3FC" stroke-width="1.8" />
  </g>

  <!-- Flake 3 -->
  <g class="flake-3" transform="translate(150, 370)">
    <circle cx="0" cy="0" r="4.5" fill="#BAE6FD" filter="url(#soft-glow)" />
    <path d="M -6 -6 L 6 6 M -6 6 L 6 -6" stroke="#E0F2FE" stroke-width="2" />
  </g>

  <!-- Flake 4 -->
  <g class="flake-4" transform="translate(260, 290)">
    <circle cx="0" cy="0" r="3.5" fill="#38BDF8" filter="url(#soft-glow)" />
  </g>

  <!-- HUD Status Caption (Subtle Top Inset) -->
  <g id="hud-status" transform="translate(60, 60)" opacity="0.85">
    <circle cx="12" cy="12" r="6" fill="#38BDF8" filter="url(#soft-glow)" />
    <text x="30" y="17" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="2">AC ACTIVE • DOG MODE COMFORT</text>
  </g>
</svg>
